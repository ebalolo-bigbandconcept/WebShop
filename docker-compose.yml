services:
  backend:
    container_name: webshop_backend_dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DOCUSIGN_PRIVATE_KEY_PATH=/run/secrets/docusign_private_key
      - ALLOW_DELETING_SIGNED_DEVIS=${ALLOW_DELETING_SIGNED_DEVIS:-true}
      - FRONTEND_URL=https://localhost
      - BACKEND_URL=https://localhost
    expose:
      - "5000"
    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app # Mount backend code for development
      - ./backend/migrations:/app/migrations
      - db_data:/app/instance
    secrets:
      - docusign_private_key
    command: >
      sh -c "
      echo 'Running database migrations...' &&
      flask db upgrade &&
      echo 'Initializing default data...' &&
      python init_db.py &&
      echo 'Starting Flask application...' &&
      python app.py
      "
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webshop-backend-dev.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.webshop-backend-dev.entrypoints=websecure"
      - "traefik.http.routers.webshop-backend-dev.tls=true"
      - "traefik.http.routers.webshop-backend-dev.priority=100"
      - "traefik.http.services.webshop-backend-dev.loadbalancer.server.port=5000"

  frontend:
    container_name: webshop_frontend_dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app # Mount frontend code for development
      - /app/node_modules # Persist node_modules in container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webshop-frontend-dev.rule=Host(`localhost`)"
      - "traefik.http.routers.webshop-frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.webshop-frontend-dev.tls=true"
      - "traefik.http.routers.webshop-frontend-dev.priority=1"
      - "traefik.http.services.webshop-frontend-dev.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.7.0-rc.1
    container_name: webshop_traefik_dev
    depends_on:
      - frontend
      - backend
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    image: redis:7-alpine
    container_name: webshop_redis_dev
    expose:
      - "6379"

  db:
    image: postgres:13-alpine
    container_name: webshop_db_dev
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  db_data:
  postgres_data_dev:

networks:
  default:
    driver: bridge

secrets:
  docusign_private_key:
    file: ./docusign/private.pem