services:
  backend:
    container_name: webshop_backend_dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DOCUSIGN_PRIVATE_KEY_PATH=/run/secrets/docusign_private_key
      - ALLOW_DELETING_SIGNED_DEVIS=${ALLOW_DELETING_SIGNED_DEVIS:-true}
      - FRONTEND_URL=https://localhost
      - BACKEND_URL=https://localhost
    expose:
      - "5000"
    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app # Mount backend code for development
      - ./backend/migrations:/app/migrations
      - db_data:/app/instance
    secrets:
      - docusign_private_key

  frontend:
    container_name: webshop_frontend_dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app # Mount frontend code for development
      - /app/node_modules # Persist node_modules in container

  proxy:
    image: nginx:alpine
    container_name: webshop_proxy_dev
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - proxy_certs:/etc/nginx/certs
    command: >
      /bin/sh -ec "
      apk add --no-cache openssl >/dev/null;
      mkdir -p /etc/nginx/certs;
      if [ ! -f /etc/nginx/certs/localhost.crt ] || [ ! -f /etc/nginx/certs/localhost.key ]; then
        openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 3650 -batch -subj '/CN=localhost' -keyout /etc/nginx/certs/localhost.key -out /etc/nginx/certs/localhost.crt;
      fi;
      nginx -g 'daemon off;'
      "

  redis:
    image: redis:7-alpine
    container_name: webshop_redis_dev
    expose:
      - "6379"

  db:
    image: postgres:13-alpine
    container_name: webshop_db_dev
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  db_data:
  postgres_data_dev:
  proxy_certs:

networks:
  default:
    driver: bridge

secrets:
  docusign_private_key:
    file: ./docusign/private.pem