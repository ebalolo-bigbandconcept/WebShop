services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DOCUSIGN_PRIVATE_KEY_PATH=/run/secrets/docusign_private_key
    expose:
      - "5000"
    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app # Mount backend code for development
      - ./backend/migrations:/app/migrations
      - db_data:/app/instance
    secrets:
      - docusign_private_key

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app # Mount frontend code for development
      - /app/node_modules # Persist node_modules in container

  proxy:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./proxy/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - proxy-only

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  db_data:
  postgres_data:

networks:
  default:
    driver: bridge

secrets:
  docusign_private_key:
    file: ./docusign/private.pem