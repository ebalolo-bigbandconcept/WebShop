services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      - FLASK_ENV=production
      - FRONTEND_URL=https://${TRAEFIK_DOMAIN:-vps117856.serveur-vps.net}
      - BACKEND_URL=https://${TRAEFIK_DOMAIN:-vps117856.serveur-vps.net}
      - DOCUSIGN_ENV=demo
      - DOCUSIGN_PRIVATE_KEY_PATH=/run/secrets/DOCUSIGN_PRIVATE_KEY
      - ALLOW_DELETING_SIGNED_DEVIS=${ALLOW_DELETING_SIGNED_DEVIS:-false}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.webshop-backend.rule=Host(`${TRAEFIK_DOMAIN:-vps117856.serveur-vps.net}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.webshop-backend.entrypoints=websecure"
      - "traefik.http.routers.webshop-backend.tls=true"
      - "traefik.http.routers.webshop-backend.tls.certresolver=le"
      - "traefik.http.routers.webshop-backend.priority=100"
      - "traefik.http.services.webshop-backend.loadbalancer.server.port=5000"
    secrets:
      - SECRET_KEY
      - ADMIN_MAIL
      - ADMIN_PASSWORD
      - DATABASE_URL
      - DOCUSIGN_ACCOUNT_ID
      - DOCUSIGN_USER_ID
      - DOCUSIGN_INTEGRATION_KEY
      - DOCUSIGN_PRIVATE_KEY
      - DOCUSIGN_ENV
    expose:
      - "5000"
    depends_on:
      - db
      - redis
    volumes:
      - db_data:/app/instance
      - ./backend/migrations:/app/migrations
    restart: always
    networks:
      - default
      - proxy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        - REACT_APP_BACKEND_URL=/api
    expose:
      - "80"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.webshop-frontend.rule=Host(`${TRAEFIK_DOMAIN:-vps117856.serveur-vps.net}`)"
      - "traefik.http.routers.webshop-frontend.entrypoints=websecure"
      - "traefik.http.routers.webshop-frontend.tls=true"
      - "traefik.http.routers.webshop-frontend.tls.certresolver=le"
      - "traefik.http.routers.webshop-frontend.priority=1"
      - "traefik.http.services.webshop-frontend.loadbalancer.server.port=80"
    restart: always
    networks:
      - default
      - proxy

  backup:
    image: restic/restic:latest
    depends_on:
      - db
    environment:
      - RESTIC_REPOSITORY=$(cat /run/secrets/RESTIC_REPOSITORY)
      - RESTIC_PASSWORD_FILE=/run/secrets/RESTIC_PASSWORD
      - RCLONE_CONFIG_PCLOUD_AUTH_FILE=/run/secrets/RCLONE_CONFIG_PCLOUD_AUTH
      - POSTGRES_DB=users_db
      - POSTGRES_USER_FILE=/run/secrets/DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/DB_PASSWORD
    secrets:
      - RESTIC_PASSWORD
      - RESTIC_REPOSITORY
      - RCLONE_CONFIG_PCLOUD_AUTH
      - DB_USER
      - DB_PASSWORD
    volumes:
      - ./backup:/backup
    restart: on-failure
    entrypoint: ["/backup/backup.sh"]
    profiles:
      - backup

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: always

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - DB_USER
      - DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always

volumes:
  db_data:
  postgres_data:

networks:
  default:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

secrets:
  SECRET_KEY:
    file: ./.env_prod_secrets/SECRET_KEY.txt
  ADMIN_MAIL:
    file: ./.env_prod_secrets/ADMIN_MAIL.txt
  ADMIN_PASSWORD:
    file: ./.env_prod_secrets/ADMIN_PASSWORD.txt
  DATABASE_URL:
    file: ./.env_prod_secrets/DATABASE_URL.txt
  DB_USER:
    file: ./.env_prod_secrets/DB_USER.txt
  DB_PASSWORD:
    file: ./.env_prod_secrets/DB_PASSWORD.txt
  RESTIC_PASSWORD:
    file: ./.env_prod_secrets/RESTIC_PASSWORD.txt
  RESTIC_REPOSITORY:
    file: ./.env_prod_secrets/RESTIC_REPOSITORY.txt
  RCLONE_CONFIG_PCLOUD_AUTH:
    file: ./.env_prod_secrets/RCLONE_CONFIG_PCLOUD_AUTH.txt
  DOCUSIGN_ACCOUNT_ID:
    file: ./.env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt
  DOCUSIGN_USER_ID:
    file: ./.env_prod_secrets/DOCUSIGN_USER_ID.txt
  DOCUSIGN_INTEGRATION_KEY:
    file: ./.env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt
  DOCUSIGN_ENV:
    file: ./.env_prod_secrets/DOCUSIGN_ENV.txt
  DOCUSIGN_PRIVATE_KEY:
    file: ./.env_prod_secrets/private.pem
  TRAEFIK_DOMAIN:
    file: ./.env_prod_secrets/TRAEFIK_DOMAIN.txt
  TRAEFIK_NETWORK:
    file: ./.env_prod_secrets/TRAEFIK_NETWORK.txt