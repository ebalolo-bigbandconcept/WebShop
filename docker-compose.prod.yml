services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      - FLASK_ENV=production
      - FRONTEND_URL=https://vps117856.serveur-vps.net
      - BACKEND_URL=https://vps117856.serveur-vps.net
      - DOCUSIGN_ENV=demo
      - DOCUSIGN_PRIVATE_KEY_PATH=/run/secrets/DOCUSIGN_PRIVATE_KEY
      - ALLOW_DELETING_SIGNED_DEVIS=${ALLOW_DELETING_SIGNED_DEVIS:-false}
    secrets:
      - SECRET_KEY
      - ADMIN_MAIL
      - ADMIN_PASSWORD
      - DATABASE_URL
      - DOCUSIGN_ACCOUNT_ID
      - DOCUSIGN_USER_ID
      - DOCUSIGN_INTEGRATION_KEY
      - DOCUSIGN_PRIVATE_KEY
    expose:
      - "5000"
    depends_on:
      - db
      - redis
    volumes:
      - db_data:/app/instance
      - ./backend/migrations:/app/migrations
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        - REACT_APP_BACKEND_URL=/api
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  proxy:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: always

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
  backup:
    image: restic/restic:latest
    depends_on:
      - db
    environment:
      - RESTIC_REPOSITORY=$(cat /run/secrets/RESTIC_REPOSITORY)
      - RESTIC_PASSWORD_FILE=/run/secrets/RESTIC_PASSWORD
      - RCLONE_CONFIG_PCLOUD_AUTH_FILE=/run/secrets/RCLONE_CONFIG_PCLOUD_AUTH
      - POSTGRES_DB=users_db
      - POSTGRES_USER_FILE=/run/secrets/DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/DB_PASSWORD
    secrets:
      - RESTIC_PASSWORD
      - RESTIC_REPOSITORY
      - RCLONE_CONFIG_PCLOUD_AUTH
      - DB_USER
      - DB_PASSWORD
    volumes:
      - ./backup:/backup
    restart: on-failure
    entrypoint: ["/backup/backup.sh"]
    profiles:
      - backup

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: always

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - DB_USER
      - DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always

volumes:
  db_data:
  postgres_data:
  certbot-www:
  letsencrypt:

networks:
  default:
    driver: bridge

secrets:
  SECRET_KEY:
    file: ./.env_prod_secrets/SECRET_KEY.txt
  ADMIN_MAIL:
    file: ./.env_prod_secrets/ADMIN_MAIL.txt
  ADMIN_PASSWORD:
    file: ./.env_prod_secrets/ADMIN_PASSWORD.txt
  DATABASE_URL:
    file: ./.env_prod_secrets/DATABASE_URL.txt
  DB_USER:
    file: ./.env_prod_secrets/DB_USER.txt
  DB_PASSWORD:
    file: ./.env_prod_secrets/DB_PASSWORD.txt
  RESTIC_PASSWORD:
    file: ./.env_prod_secrets/RESTIC_PASSWORD.txt
  RESTIC_REPOSITORY:
    file: ./.env_prod_secrets/RESTIC_REPOSITORY.txt
  RCLONE_CONFIG_PCLOUD_AUTH:
    file: ./.env_prod_secrets/RCLONE_CONFIG_PCLOUD_AUTH.txt
  DOCUSIGN_ACCOUNT_ID:
    file: ./.env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt
  DOCUSIGN_USER_ID:
    file: ./.env_prod_secrets/DOCUSIGN_USER_ID.txt
  DOCUSIGN_INTEGRATION_KEY:
    file: ./.env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt
  DOCUSIGN_PRIVATE_KEY:
    file: ./.env_prod_secrets/private.pem