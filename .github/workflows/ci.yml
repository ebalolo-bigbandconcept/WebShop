name: CI - Tests and Build

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      build: ${{ steps.filter.outputs.build }}
      deploy: ${{ steps.filter.outputs.deploy }}
      backend_last_failed: ${{ steps.check_last_run.outputs.backend_failed }}
      frontend_last_failed: ${{ steps.check_last_run.outputs.frontend_failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose*.yml'
              - 'proxy/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - '.github/workflows/ci.yml'
            build:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'
              - 'proxy/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
            deploy:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'
              - 'proxy/**'
              - 'backend/Dockerfile*'
              - 'frontend/Dockerfile*'
              - '.github/workflows/ci.yml'

      - name: Check last workflow run status
        id: check_last_run
        uses: actions/github-script@v7
        with:
          script: |
            // Get the current branch
            const branch = context.ref.replace('refs/heads/', '');
            
            // Fetch the last completed workflow run on this branch
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: branch,
              status: 'completed',
              per_page: 2 // Get last 2 to skip the current one
            });
            
            let backend_failed = 'false';
            let frontend_failed = 'false';
            
            if (runs.data.workflow_runs.length > 0) {
              // Get the most recent completed run (which might be current)
              const lastRun = runs.data.workflow_runs[runs.data.workflow_runs.length - 1];
              
              // Fetch job details from last run
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: lastRun.id
              });
              
              // Check if backend or frontend tests failed
              const backendTest = jobs.data.jobs.find(job => job.name === 'Backend Tests');
              const frontendLint = jobs.data.jobs.find(job => job.name === 'Frontend Lint & Build');
              
              if (backendTest && backendTest.conclusion === 'failure') {
                backend_failed = 'true';
                console.log('Backend tests failed in last run');
              }
              
              if (frontendLint && frontendLint.conclusion === 'failure') {
                frontend_failed = 'true';
                console.log('Frontend linting failed in last run');
              }
            }
            
            core.setOutput('backend_failed', backend_failed);
            core.setOutput('frontend_failed', frontend_failed);

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_last_failed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create test .env file
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-only
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=TestPassword123!
          REACT_APP_BACKEND_URL=/api
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:3000
          DATABASE_URL=postgresql://dev_user:dev_password@db:5432/users_db
          DOCUSIGN_ACCOUNT_ID=test
          DOCUSIGN_USER_ID=test
          DOCUSIGN_INTEGRATION_KEY=test
          DOCUSIGN_ENV=demo
          FLASK_ENV=development
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-secret-key-for-ci-only
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          TestPassword123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF

      - name: Start dependencies (PostgreSQL & Redis)
        run: |
          docker compose -f docker-compose.prod.yml up -d db redis
          # Wait for PostgreSQL to be ready
          timeout 60 bash -c 'until docker compose -f docker-compose.prod.yml exec -T db pg_isready -U dev_user; do sleep 1; done'

      - name: Build backend image
        run: docker compose -f docker-compose.prod.yml build backend

      - name: Run database migrations
        run: |
          docker compose -f docker-compose.prod.yml run --rm backend flask db upgrade

      - name: Run backend tests with coverage (unit+integration)
        run: |
          docker compose -f docker-compose.prod.yml run --rm -v $PWD/backend:/app backend bash -c "
            pip install --no-cache-dir pytest pytest-flask pytest-cov pytest-mock faker coverage &&
            python -m pytest tests/unit tests/integration -v --cov=. --cov-report=xml --cov-report=term-missing --cov-report=html &&
            python -m coverage report --fail-under=80 || (echo 'Coverage below 80% threshold' && exit 1)
          "
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.frontend_last_failed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint (if configured)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint || echo "No lint script configured"
      
      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: /api
          CI: false  # Treat warnings as warnings, not errors
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  backend-lint:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_last_failed == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black isort
      
      - name: Run flake8
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code formatting with black
        working-directory: backend
        run: black --check .
      
      - name: Check import sorting with isort
        working-directory: backend
        run: isort --check-only .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.pull_request.head.repo.fork == false
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-lint]
    if: ${{ always() && needs.changes.outputs.build == 'true' && (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') && (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create test .env
        run: |
          cat > .env << EOF
          SECRET_KEY=test-key
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=Test123!
          REACT_APP_BACKEND_URL=/api
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-key
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          Test123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF
      
      - name: Build all images
        run: |
          docker compose -f docker-compose.prod.yml build
      
      - name: Test container startup
        run: |
          docker compose -f docker-compose.prod.yml up -d
          timeout 60 bash -c 'until docker compose -f docker-compose.prod.yml ps --status=running | grep -q "Up"; do sleep 2; done'
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs
      
      - name: Verify services are healthy
        run: |
          # Check if containers are running
          docker compose -f docker-compose.prod.yml ps | grep -q "Up" || exit 1
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  integration-test:
    name: Full Integration Test
    runs-on: ubuntu-latest
    needs: [changes, docker-build]
    if: ${{ always() && needs.changes.outputs.build == 'true' && (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          SECRET_KEY=$(openssl rand -base64 32)
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=TestPassword123!
          REACT_APP_BACKEND_URL=/api
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:3000
          DATABASE_URL=postgresql://dev_user:dev_password@db:5432/users_db
          DOCUSIGN_ACCOUNT_ID=test-account
          DOCUSIGN_USER_ID=test-user
          DOCUSIGN_INTEGRATION_KEY=test-key
          DOCUSIGN_ENV=demo
          FLASK_ENV=development
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-secret-key-for-ci-only
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          TestPassword123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test-account
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test-user
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test-key
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF
      
      - name: Start all services
        run: |
          docker compose -f docker-compose.prod.yml up -d --build
      
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/user/me 2>/dev/null; do sleep 2; done' || true
      
      - name: Run E2E tests
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend bash -c "
            pip install --no-cache-dir pytest pytest-flask pytest-mock faker &&
            python -m pytest tests/e2e/ -v
          "
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose -f docker-compose.prod.yml logs backend
          echo "=== Frontend logs ==="
          docker compose -f docker-compose.prod.yml logs frontend
          echo "=== Proxy logs ==="
          docker compose -f docker-compose.prod.yml logs proxy
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  deploy-production:
    name: Production Server Deploy
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-lint, backend-lint, security-scan, docker-build, integration-test]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true' && needs.changes.outputs.build == 'true' && (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') && (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') && (needs.backend-lint.result == 'success' || needs.backend-lint.result == 'skipped') && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') && (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') && (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.WORK_DIR }}
            git config --global --add safe.directory ${{ secrets.WORK_DIR }}
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec backend flask db upgrade

  deploy-staging:
    name: Dev Server Deploy
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-lint, backend-lint, security-scan, docker-build, integration-test]
    if: ${{ always() && github.ref == 'refs/heads/dev' && (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') && (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') && (needs.backend-lint.result == 'success' || needs.backend-lint.result == 'skipped') && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') && (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') && (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            cd ${{ secrets.WORK_DIR_DEV }}
            git config --global --add safe.directory ${{ secrets.WORK_DIR_DEV }}
            git fetch origin
            git reset --hard origin/dev
            git pull origin dev
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec backend flask db upgrade
            docker compose -f docker-compose.prod.yml up -d