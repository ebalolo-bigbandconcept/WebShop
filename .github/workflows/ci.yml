name: CI - Tests and Build

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create test .env file
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-only
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=TestPassword123!
          REACT_APP_BACKEND_URL=/api
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:3000
          DATABASE_URL=postgresql://dev_user:dev_password@db:5432/users_db
          DOCUSIGN_ACCOUNT_ID=test
          DOCUSIGN_USER_ID=test
          DOCUSIGN_INTEGRATION_KEY=test
          DOCUSIGN_ENV=demo
          FLASK_ENV=development
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-secret-key-for-ci-only
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          TestPassword123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF

      - name: Start dependencies (PostgreSQL & Redis)
        run: |
          docker compose -f docker-compose.prod.yml up -d db redis
          # Wait for PostgreSQL to be ready
          timeout 60 bash -c 'until docker compose -f docker-compose.prod.yml exec -T db pg_isready -U dev_user; do sleep 1; done'

      - name: Build backend image
        run: docker compose -f docker-compose.prod.yml build backend

      - name: Run database migrations
        run: |
          docker compose -f docker-compose.prod.yml run --rm backend flask db upgrade

      - name: Run backend tests with coverage (unit+integration)
        run: |
          docker compose -f docker-compose.prod.yml run --rm -v $PWD/backend:/app backend bash -c "
            pip install --no-cache-dir pytest pytest-flask pytest-cov pytest-mock faker coverage &&
            python -m pytest tests/unit tests/integration -v --cov=. --cov-report=xml --cov-report=term-missing --cov-report=html &&
            python -m coverage report --fail-under=85 || (echo 'Coverage below 85% threshold' && exit 1)
          "
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 30
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint (if configured)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint || echo "No lint script configured"
      
      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: /api
          CI: false  # Treat warnings as warnings, not errors
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  backend-lint:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black isort
      
      - name: Run flake8
        working-directory: backend
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code formatting with black
        working-directory: backend
        continue-on-error: true
        run: black --check .
      
      - name: Check import sorting with isort
        working-directory: backend
        continue-on-error: true
        run: isort --check-only .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event.pull_request.head.repo.fork == false
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create test .env
        run: |
          cat > .env << EOF
          SECRET_KEY=test-key
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=Test123!
          REACT_APP_BACKEND_URL=/api
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-key
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          Test123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF
      
      - name: Build all images
        run: |
          docker compose -f docker-compose.prod.yml build
      
      - name: Test container startup
        run: |
          docker compose -f docker-compose.prod.yml up -d
          sleep 10
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs
      
      - name: Verify services are healthy
        run: |
          # Check if containers are running
          docker compose -f docker-compose.prod.yml ps | grep -q "Up" || exit 1
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  integration-test:
    name: Full Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          SECRET_KEY=$(openssl rand -base64 32)
          ADMIN_MAIL=admin@test.com
          ADMIN_PASSWORD=TestPassword123!
          REACT_APP_BACKEND_URL=/api
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:3000
          DATABASE_URL=postgresql://dev_user:dev_password@db:5432/users_db
          DOCUSIGN_ACCOUNT_ID=test-account
          DOCUSIGN_USER_ID=test-user
          DOCUSIGN_INTEGRATION_KEY=test-key
          DOCUSIGN_ENV=demo
          FLASK_ENV=development
          EOF

      - name: Prepare prod-style secrets for CI
        run: |
          mkdir -p .env_prod_secrets
          cat > .env_prod_secrets/SECRET_KEY.txt <<'EOF'
          test-secret-key-for-ci-only
          EOF
          cat > .env_prod_secrets/ADMIN_MAIL.txt <<'EOF'
          admin@test.com
          EOF
          cat > .env_prod_secrets/ADMIN_PASSWORD.txt <<'EOF'
          TestPassword123!
          EOF
          cat > .env_prod_secrets/DATABASE_URL.txt <<'EOF'
          postgresql://dev_user:dev_password@db:5432/users_db
          EOF
          cat > .env_prod_secrets/DB_USER.txt <<'EOF'
          dev_user
          EOF
          cat > .env_prod_secrets/DB_PASSWORD.txt <<'EOF'
          dev_password
          EOF
          cat > .env_prod_secrets/DOCUSIGN_ACCOUNT_ID.txt <<'EOF'
          test-account
          EOF
          cat > .env_prod_secrets/DOCUSIGN_USER_ID.txt <<'EOF'
          test-user
          EOF
          cat > .env_prod_secrets/DOCUSIGN_INTEGRATION_KEY.txt <<'EOF'
          test-key
          EOF
          cat > .env_prod_secrets/private.pem <<'EOF'
          -----BEGIN PRIVATE KEY-----
          dummy-placeholder-for-ci-only
          -----END PRIVATE KEY-----
          EOF
      
      - name: Start all services
        run: |
          docker compose -f docker-compose.prod.yml up -d --build
          sleep 15
      
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/user/me 2>/dev/null; do sleep 2; done' || true
      
      - name: Run E2E tests
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend bash -c "
            pip install --no-cache-dir pytest pytest-flask pytest-mock faker &&
            python -m pytest tests/e2e/ -v
          "
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose -f docker-compose.prod.yml logs backend
          echo "=== Frontend logs ==="
          docker compose -f docker-compose.prod.yml logs frontend
          echo "=== Proxy logs ==="
          docker compose -f docker-compose.prod.yml logs proxy
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  deploy-production:
    name: Production Server Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, backend-lint, security-scan, docker-build, integration-test]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH and Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # port: ${{ secrets.SSH_PORT }}  # Optional, defaults to 22
          script: |
            set -e
            WORK_DIR="${{ secrets.WORK_DIR }}"
            REPO="${{ github.repository }}"
            TOKEN="${{ secrets.DEPLOY_GIT_TOKEN }}"

            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # Clone repo if not present, else update
            if [ ! -d .git ]; then
              if [ -n "$TOKEN" ]; then
                git clone "https://x-access-token:$TOKEN@github.com/$REPO" .
              else
                git clone "https://github.com/$REPO" .
              fi
            fi

            if [ -n "$TOKEN" ]; then
              git remote set-url origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
            fi

            git fetch --all
            git checkout main || true
            
            # Backup prod secrets before reset
            if [ -d .env_prod_secrets ]; then
              cp -r .env_prod_secrets .env_prod_secrets.bak
            fi
            
            git reset --hard origin/main
            
            # Restore prod secrets after reset
            if [ -d .env_prod_secrets.bak ]; then
              rm -rf .env_prod_secrets
              mv .env_prod_secrets.bak .env_prod_secrets
            fi

            # Create .env file from secrets
            cat > .env << 'ENVEOF'
            SECRET_KEY="${{ secrets.SECRET_KEY }}"
            ADMIN_MAIL="${{ secrets.ADMIN_MAIL }}"
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            BACKEND_URL="${{ secrets.BACKEND_URL }}"
            DOCUSIGN_ACCOUNT_ID="${{ secrets.DOCUSIGN_ACCOUNT_ID }}"
            DOCUSIGN_USER_ID="${{ secrets.DOCUSIGN_USER_ID }}"
            DOCUSIGN_INTEGRATION_KEY="${{ secrets.DOCUSIGN_INTEGRATION_KEY }}"
            DOCUSIGN_ENV="${{ secrets.DOCUSIGN_ENV }}"
            REACT_APP_BACKEND_URL="/api"
            FLASK_ENV="production"
            ENVEOF

            # Build and restart services
            export DOCKER_CONFIG="$WORK_DIR/.docker"
            mkdir -p "$DOCKER_CONFIG"
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Apply DB migrations and init defaults
            docker compose -f docker-compose.prod.yml exec -T backend flask db upgrade || true
            docker compose -f docker-compose.prod.yml exec -T backend python init_db.py || true

            docker compose -f docker-compose.prod.yml ps

  deploy-staging:
    name: Dev Server Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint, backend-lint, security-scan, docker-build, integration-test]
    if: github.ref == 'refs/heads/dev' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          # port: ${{ secrets.SSH_PORT_DEV }}  # Optional, defaults to 22
          script: |
            set -e
            WORK_DIR="${{ secrets.WORK_DIR_DEV }}"
            REPO="${{ github.repository }}"
            TOKEN="${{ secrets.DEPLOY_GIT_TOKEN }}"

            mkdir -p "$WORK_DIR"
            cd "$WORK_DIR"

            # Clone repo if not present, else update
            if [ ! -d .git ]; then
              if [ -n "$TOKEN" ]; then
                git clone "https://x-access-token:$TOKEN@github.com/$REPO" .
              else
                git clone "https://github.com/$REPO" .
              fi
            fi

            if [ -n "$TOKEN" ]; then
              git remote set-url origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
            fi

            git fetch --all
            git checkout dev || true
            
            # Backup prod secrets before reset
            if [ -d .env_prod_secrets ]; then
              cp -r .env_prod_secrets .env_prod_secrets.bak
            fi
            
            git reset --hard origin/dev
            
            # Restore prod secrets after reset
            if [ -d .env_prod_secrets.bak ]; then
              rm -rf .env_prod_secrets
              mv .env_prod_secrets.bak .env_prod_secrets
            fi

            # Create .env file from secrets
            cat > .env << 'ENVEOF'
            SECRET_KEY="${{ secrets.SECRET_KEY_DEV }}"
            ADMIN_MAIL="${{ secrets.ADMIN_MAIL_DEV }}"
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD_DEV }}"
            DATABASE_URL="${{ secrets.DATABASE_URL_DEV }}"
            FRONTEND_URL="${{ secrets.FRONTEND_URL_DEV }}"
            BACKEND_URL="${{ secrets.BACKEND_URL_DEV }}"
            DOCUSIGN_ACCOUNT_ID="${{ secrets.DOCUSIGN_ACCOUNT_ID_DEV }}"
            DOCUSIGN_USER_ID="${{ secrets.DOCUSIGN_USER_ID_DEV }}"
            DOCUSIGN_INTEGRATION_KEY="${{ secrets.DOCUSIGN_INTEGRATION_KEY_DEV }}"
            DOCUSIGN_ENV="${{ secrets.DOCUSIGN_ENV_DEV }}"
            REACT_APP_BACKEND_URL="/api"
            FLASK_ENV="development"
            ENVEOF

            # Build and restart services (dev compose)
            export DOCKER_CONFIG="$WORK_DIR/.docker"
            mkdir -p "$DOCKER_CONFIG"
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Apply DB migrations and init defaults (safe if already applied)
            docker compose -f docker-compose.prod.yml exec -T backend flask db upgrade || true
            docker compose -f docker-compose.prod.yml exec -T backend python init_db.py || true

            docker compose -f docker-compose.prod.yml ps
