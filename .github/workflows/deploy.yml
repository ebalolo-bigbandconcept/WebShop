name: CD - Deploy to Production

on:
  workflow_dispatch:  # Allow manual deployment
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://your-domain.com  # Update with the actual domain
    
    # Only run if all tests passed
    needs: []
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DOCUSIGN_ACCOUNT_ID: ${{ secrets.DOCUSIGN_ACCOUNT_ID }}
          DOCUSIGN_USER_ID: ${{ secrets.DOCUSIGN_USER_ID }}
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /path/to/webshop  # Update with actual path
            
            # Pull latest code
            git pull origin main

            # Detect migration changes in this deploy
            MIGRATIONS_CHANGED=""
            if git rev-parse --verify ORIG_HEAD >/dev/null 2>&1; then
              MIGRATIONS_CHANGED=$(git diff --name-only ORIG_HEAD HEAD -- backend/migrations/versions/ || true)
            fi
            
            # Update .env with secrets
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "ADMIN_MAIL=${{ secrets.ADMIN_MAIL }}" >> .env
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
            # Add other production secrets...
            
            # Deploy with zero-downtime
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate

            # Run database migrations if needed (after the new image is up)
            if [ -n "$MIGRATIONS_CHANGED" ]; then
              docker compose -f docker-compose.prod.yml exec -T backend flask db upgrade
            fi
            
            # Verify deployment
            sleep 10
            curl -f http://localhost/api/user/me || exit 1
            
            # Cleanup old images
            docker image prune -f
      
      - name: Create GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            - Automated deployment via GitHub Actions
            - See commit history for details
          draft: false
          prerelease: false

  backup-before-deploy:
    name: Backup Database Before Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Create database backup
        uses: appleboy/ssh-action@v1.0.0
        env:
          DB_USER: ${{ secrets.DB_USER }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Create backup directory
            mkdir -p /backups/$(date +%Y-%m-%d)
            
            # Backup PostgreSQL database
            docker compose exec -T db pg_dump -U "$DB_USER" users_db | gzip > /backups/$(date +%Y-%m-%d)/backup_$(date +%H-%M-%S).sql.gz
            
            # Keep only last 7 days of backups
            find /backups -type f -mtime +7 -delete
